<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>던전 다이버</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>⚔️ 던전 다이버</h1>
      <div class="top-right">
        <span id="floorLabel" class="floor-label">1층</span>
        <button id="mute" class="icon-btn" title="소리 켜기/끄기 (M)">🔊</button>
      </div>
    </header>

    <main class="layout">
      <section class="board">
        <canvas id="game" aria-label="게임 화면"></canvas>
        <div id="dpad" class="dpad">
          <div class="pad">
            <button data-dir="-1,-1">↖</button><button data-dir="0,-1">↑</button><button data-dir="1,-1">↗</button>
            <button data-dir="-1,0">←</button><button data-act="wait" title="대기">⏳</button><button data-dir="1,0">→</button>
            <button data-dir="-1,1">↙</button><button data-dir="0,1">↓</button><button data-dir="1,1">↘</button>
          </div>
          <button class="descend" data-act="descend">⏬ 내려가기</button>
        </div>
      </section>

      <aside class="side">
        <div class="panel">
          <div class="hp">
            <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
            <span id="hpText" class="hp-text">30 / 30</span>
          </div>
          <div class="xp"><div id="xpFill" class="xp-fill"></div></div>
          <div id="stats" class="stats"></div>
          <div id="equip" class="equip"></div>
          <div id="status" class="status"></div>
        </div>

        <div class="panel">
          <h2>가방 <small>(숫자키 1~8로 사용)</small></h2>
          <div id="inv" class="inv"></div>
        </div>

        <div class="panel log-panel">
          <h2>기록</h2>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="overlay" class="overlay"></div>

  <script src="game.js"></script>
</body>
</html>
